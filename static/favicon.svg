<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#g)"/>

  <!-- Baseline -->
  <line x1="5" y1="25.5" x2="27" y2="25.5"
        stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chart line (upward trend) -->
  <polyline points="5,22 10,17 15,19.5 21,11 27,13.5"
            fill="none" stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dot at the tip -->
  <circle cx="27" cy="13.5" r="2.2" fill="white"/>
</svg>

